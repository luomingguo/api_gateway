global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'apisix-control-plane'
    static_configs:
      - targets: ['host.docker.internal:9191']
    metrics_path: /apisix/prometheus/metrics

  - job_name: 'apisix-data-plane'
    static_configs:
      - targets: ['host.docker.internal:9192']
    metrics_path: /apisix/prometheus/metrics
