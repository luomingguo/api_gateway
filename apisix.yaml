# 路由声明，文件变化自动热重载（1s内）
apisix:
  config_provider: yaml      # Standalone 模式关键配置

plugins:
  # 官方插件按需开启
  - jwt-auth
  - limit-req
  - ip-restriction
  - geoip2
  - prometheus
  - request-id
  # 你的自定义插件，文件名即插件名
  - geo-cn-proxy
  - tenant-ratelimit
  - ai-response-cache

plugin_attr:
  prometheus:
    export_uri: /metrics
    export_addr:
      ip: "0.0.0.0"
      port: 9091