services:
  apisix:
    image: your-registry/apisix-custom:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:9080"
      - "443:9443"
    volumes:
      # 只挂载 apisix.yaml，路由变更不需要重建镜像
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      - APISIX_STAND_ALONE=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9080/apisix/status"]
      interval: 10s

  # etcd 模式时取消注释
  # etcd:
  #   image: bitnami/etcd:3.5
  #   environment:
  #     ALLOW_NONE_AUTHENTICATION: "yes"